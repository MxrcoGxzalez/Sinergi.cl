services:
  web:
    build: .
    # Aplica migraciones pendientes antes de levantar (evita errores 500 por columnas faltantes)
    command: sh -c "python manage.py migrate --noinput && python manage.py runserver 0.0.0.0:8000"
    volumes:
      - .:/app
    ports:
      - "8000:8000"
    env_file: .env
    depends_on:
      - db
      - redis

  db:
    image: postgres:16
    volumes:
      - postgres_data:/var/lib/postgresql/data
    env_file: .env

  redis:
    image: redis:7-alpine

  celery-worker:
    build: .
    command: celery -A sinergi worker -l info
    volumes:
      - .:/app
    env_file: .env
    depends_on: [redis, db]

  celery-beat:
    build: .
    command: celery -A sinergi beat -l info
    volumes:
      - .:/app
    env_file: .env
    depends_on: [redis, db]

volumes:
  postgres_data: