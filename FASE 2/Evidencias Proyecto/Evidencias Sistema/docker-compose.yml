services:
  web:
    build: .
    # Aplica migraciones pendientes antes de levantar (evita errores 500 por columnas faltantes)
    command: sh -c "python manage.py migrate --noinput && python manage.py runserver 0.0.0.0:8000"
    volumes:
      - .:/app
    ports:
      - "8000:8000"
    env_file: .env
    depends_on:
      - db
      - redis

  db:
    image: postgres:16
    volumes:
      - postgres_data:/var/lib/postgresql/data
    env_file: .env

  redis:
    image: redis:7-alpine

  celery-worker:
    build: .
    command: celery -A sinergi worker -l info
    volumes:
      - .:/app
    env_file: .env
    depends_on: [redis, db]

  celery-beat:
    build: .
    command: celery -A sinergi beat -l info
    volumes:
      - .:/app
    env_file: .env
    depends_on: [redis, db]

  # Antivirus de los documentos subidos (proyectos/antivirus.py). Al arrancar descarga las firmas
  # de virus (unos minutos la primera vez); mientras no responde, las subidas se rechazan.
  clamav:
    image: clamav/clamav:1.4
    volumes:
      - clamav_firmas:/var/lib/clamav
    restart: unless-stopped

  # Respaldos automáticos: diario, semanal y semanal anterior (BD + documentos) en ./respaldos/
  # Ver scripts/respaldo.sh. Misma imagen que la BD, así pg_dump coincide con la versión del servidor.
  respaldos:
    image: postgres:16
    command: sh /scripts/respaldo.sh
    environment:
      TZ: America/Santiago
    env_file: .env
    volumes:
      - ./scripts:/scripts:ro
      - ./media:/media:ro
      - ./respaldos:/respaldos
    depends_on: [db]
    restart: unless-stopped

volumes:
  postgres_data:
  clamav_firmas: