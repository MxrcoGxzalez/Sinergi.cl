<!-- Observar un documento: abre una petición de tipo "documento" al cliente de la obra.
     Usado por el empleado y el admin. Botón: requestCorrection(nombre, proyecto_id, documento_id). -->
  <!-- ==================== MODAL: SOLICITAR CORRECCIÓN TÉCNICA ==================== -->
  <div id="correction-modal" class="fixed inset-0 bg-slate-900/60 backdrop-blur-sm z-50 hidden flex items-center justify-center p-4">
    <div class="bg-white rounded-lg border border-slate-200 shadow-xl max-w-md w-full max-h-[90vh] overflow-y-auto">

      <div class="px-5 py-4 bg-slate-50 border-b border-slate-200 flex justify-between items-center">
        <div>
          <h3 class="text-sm font-bold text-slate-900">Solicitar Revisión / Corrección al Cliente</h3>
          <p class="text-[11px] text-slate-500 font-mono" id="modal-corr-proj">Proyecto</p>
        </div>
        <button onclick="closeCorrectionModal()" class="text-slate-400 hover:text-slate-600 text-lg leading-none">&times;</button>
      </div>

      <!-- La observación se envía al cliente como una petición de tipo "documento" -->
      <form method="POST" action="{% url 'proyectos:nueva_peticion' %}" class="p-5 space-y-4">
        {% csrf_token %}
        <input type="hidden" name="proyecto" id="modal-corr-proyecto">
        <input type="hidden" name="tipo" value="DOCUMENTO">
        <input type="hidden" name="asunto" id="modal-corr-asunto">
        <input type="hidden" name="documento" id="modal-corr-documento">
        <div>
          <label class="block text-xs font-medium text-slate-500">Documento observado:</label>
          <div class="mt-1 text-xs font-semibold text-slate-800 bg-slate-100 p-2 rounded border border-slate-200 font-mono truncate" id="modal-corr-doc"></div>
        </div>

        <div>
          <label class="block text-xs font-semibold text-slate-700 mb-1">Motivo técnico de la observación *</label>
          <textarea name="mensaje" id="modal-corr-reason" rows="3" required maxlength="3000" placeholder="Indique claramente por qué se solicita corregir (firmas faltantes, escala ilegible, memoria desactualizada)..." class="w-full text-xs border border-slate-300 rounded p-2.5 focus:border-sinergi-blue outline-none"></textarea>
        </div>

        <div class="pt-3 border-t border-slate-200 flex justify-end gap-2">
          <button type="button" onclick="closeCorrectionModal()" class="px-3.5 py-1.5 text-xs text-slate-600 hover:bg-slate-100 rounded font-medium">Cancelar</button>
          <button type="submit" class="px-4 py-1.5 text-xs bg-sinergi-red hover:bg-sinergi-red-hover text-white font-semibold rounded shadow-sm">
            Enviar Observación al Cliente
          </button>
        </div>
      </form>
    </div>
  </div>

  <!-- ==================== LOGICA JAVASCRIPT ==================== -->

  <script>
    function requestCorrection(docName, projectId, docId) {
      document.getElementById('modal-corr-documento').value = docId;
      document.getElementById('modal-corr-doc').textContent = docName;
      document.getElementById('modal-corr-proj').textContent = 'Proyecto: SNG-' + projectId;
      document.getElementById('modal-corr-proyecto').value = projectId;
      document.getElementById('modal-corr-asunto').value = ('Observación: ' + docName).slice(0, 150);
      document.getElementById('correction-modal').classList.remove('hidden');
    }

    function closeCorrectionModal() {
      document.getElementById('correction-modal').classList.add('hidden');
      document.getElementById('modal-corr-reason').value = '';
    }
  </script>
