<!-- Formulario del código de 6 dígitos (login, activar y desactivar 2FA). `accion`: URL destino; vacío = la misma página. -->
<form method="POST"{% if accion %} action="{{ accion }}"{% endif %} class="mt-5 space-y-3">
  {% csrf_token %}
  <input type="text" name="codigo" inputmode="numeric" autocomplete="one-time-code" pattern="[0-9]{6}" maxlength="6"
         required {% if not accion %}autofocus{% endif %} placeholder="000000" aria-label="Código de 6 dígitos"
         class="w-full text-center font-mono text-2xl tracking-[0.5em] border border-slate-300 rounded-md py-3 focus:outline-none focus:ring-2 focus:ring-[#C52222]">
  <button type="submit" class="w-full py-3 text-xs {% if peligro %}border border-slate-300 text-slate-700 hover:border-[#C52222] hover:text-[#C52222]{% else %}bg-[#C52222] hover:bg-[#A71D1D] text-white shadow-sm{% endif %} font-semibold rounded uppercase tracking-wider">{{ boton }}</button>
</form>
