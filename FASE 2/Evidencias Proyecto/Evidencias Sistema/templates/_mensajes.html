{% for message in messages %}
  <div class="mb-4 px-4 py-3 rounded-md text-xs font-semibold border
    {% if message.tags == 'error' %}bg-red-50 border-red-300 text-red-800
    {% elif message.tags == 'warning' %}bg-amber-50 border-amber-300 text-amber-900
    {% else %}bg-emerald-50 border-emerald-300 text-emerald-900{% endif %}">
    {{ message }}
  </div>
{% endfor %}
{% if form.errors %}
  <div class="mb-4 px-4 py-3 rounded-md text-xs font-semibold border bg-red-50 border-red-300 text-red-800">
    {% for field, errores in form.errors.items %}{% for error in errores %}<p>{{ error }}</p>{% endfor %}{% endfor %}
  </div>
{% endif %}
