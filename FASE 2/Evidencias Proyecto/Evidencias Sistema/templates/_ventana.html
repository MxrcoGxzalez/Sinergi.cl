<!-- Ventana sobrepuesta del panel: abre una página interna encima del panel, sin salir de él.
     Uso: <a href="..." data-ventana> (ventana centrada), data-ventana="lateral" (panel lateral, el chat) o
     data-ventana="ancha" (centrada y más ancha). Ctrl+clic o clic central siguen abriendo otra pestaña.
     - La página se carga en un iframe del mismo sitio, así funciona igual que sola (chat, validaciones, avisos).
       Solo se pueden enmarcar las vistas con @ventana_interna (sinergi/seguridad.py); dentro de la ventana
       base_usuarios.html oculta la barra superior y el pie. La página puede fijar su forma con data-ventana-tipo.
     - Al guardar un formulario, la vista responde ventana_cerrar.html con el destino: la ventana se cierra y el
       panel completo va ahí (recarga con el aviso de "guardado").
     - Si la ventana termina en una página que no se puede enmarcar (sesión vencida...), se cierra y recarga.
     - Al cerrarla sin guardar se actualiza la bandeja de peticiones (data-vivo="bandeja-peticiones") y su aviso. -->
<div id="ventana" class="ventana" hidden>
  <div class="ventana-fondo" data-cerrar-ventana></div>
  <div id="ventana-caja" class="ventana-caja" role="dialog" aria-modal="true" aria-labelledby="ventana-titulo">
    <div class="ventana-barra">
      <span id="ventana-titulo" class="text-xs font-semibold text-slate-700 truncate">Cargando…</span>
      <div class="flex items-center gap-1 shrink-0">
        <a id="ventana-completa" href="#" title="Abrir en página completa" aria-label="Abrir en página completa" class="ventana-boton">
          <svg class="w-4 h-4" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24" aria-hidden="true"><path d="M14 4h6v6M20 4l-8 8M10 6H5a1 1 0 0 0-1 1v12a1 1 0 0 0 1 1h12a1 1 0 0 0 1-1v-5" stroke-linecap="round" stroke-linejoin="round"/></svg>
        </a>
        <button type="button" data-cerrar-ventana title="Cerrar (Esc)" aria-label="Cerrar" class="ventana-boton">
          <svg class="w-4 h-4" fill="none" stroke="currentColor" stroke-width="2.2" viewBox="0 0 24 24" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18" stroke-linecap="round"/></svg>
        </button>
      </div>
    </div>
    <iframe id="ventana-marco" class="ventana-marco" title="Contenido de la ventana"></iframe>
  </div>
</div>
<script>
  (function () {
    if (window.top !== window.self) return;  // dentro de la propia ventana no se anidan ventanas
    const URL_NO_LEIDAS = "{% url 'proyectos:peticiones_no_leidas' %}";
    const ventana = document.getElementById('ventana');
    document.body.appendChild(ventana);  // fuera de pestañas ocultas: se ve desde cualquier sección del panel
    const caja = document.getElementById('ventana-caja');
    const marco = document.getElementById('ventana-marco');
    const titulo = document.getElementById('ventana-titulo');
    const completa = document.getElementById('ventana-completa');
    let abierta = false, anteriorFoco = null;

    function abrir(url, tipo) {
      anteriorFoco = document.activeElement;
      abierta = true;
      titulo.textContent = 'Cargando…';
      caja.dataset.tipo = tipo || 'centrada';
      caja.classList.add('ventana-cargando');
      ventana.hidden = false;
      document.body.style.overflow = 'hidden';
      marco.contentWindow.location.replace(url);  // replace: no ensucia el historial del navegador
    }

    function cerrar(despues) {  // despues: undefined = refrescar la bandeja, true = recargar, 'url' = ir ahí
      if (!abierta) return;
      abierta = false;
      ventana.hidden = true;
      document.body.style.overflow = '';
      marco.contentWindow.location.replace('about:blank');  // detiene lo que corra adentro (el chat)
      if (anteriorFoco) anteriorFoco.focus();
      if (typeof despues === 'string') location.assign(despues);
      else if (despues) location.reload();
      else refrescarBandeja();
    }

    marco.addEventListener('load', () => {
      if (!abierta) return;
      let doc = null;
      try { doc = marco.contentDocument; } catch (e) { /* página bloqueada para iframes */ }
      const destino = doc && doc.getElementById('ventana-destino');
      if (destino) {  // formulario guardado: el panel va al destino (ventana_cerrar.html)
        const url = new URL(JSON.parse(destino.textContent), location.href);
        cerrar(url.origin === location.origin ? url.href : true);
        return;
      }
      if (!doc || !doc.documentElement.classList.contains('en-ventana')) { cerrar(true); return; }
      const forma = doc.querySelector('[data-ventana-tipo]');
      caja.dataset.tipo = forma ? forma.dataset.ventanaTipo : 'centrada';
      caja.classList.remove('ventana-cargando');
      titulo.textContent = doc.title.replace(/\s*\|\s*Sinergi\s*$/, '');
      completa.href = marco.contentWindow.location.href;
      marco.focus();
    });

    async function refrescarBandeja() {
      try {
        const zona = document.querySelector('[data-vivo="bandeja-peticiones"]');
        if (zona) {
          const r = await fetch(location.href, {cache: 'no-store', headers: {'X-En-Vivo': '1'}});
          if (r.ok && !r.redirected) {
            const nueva = new DOMParser().parseFromString(await r.text(), 'text/html')
              .querySelector('[data-vivo="bandeja-peticiones"]');
            if (nueva) zona.innerHTML = nueva.innerHTML;
          }
        }
        const badge = document.getElementById('badge-peticiones');
        if (badge) {
          const r = await fetch(URL_NO_LEIDAS, {headers: {Accept: 'application/json'}});
          if (r.ok) {
            const n = (await r.json()).no_leidas;
            badge.textContent = n;
            badge.style.display = n ? '' : 'none';
          }
        }
      } catch (e) { /* sin conexión: la bandeja se ve al recargar */ }
    }

    document.addEventListener('click', e => {
      const enlace = e.target.closest('a[data-ventana]');
      if (enlace && e.button === 0 && !e.ctrlKey && !e.metaKey && !e.shiftKey && !e.altKey) {
        e.preventDefault();
        abrir(enlace.href, enlace.dataset.ventana);
      } else if (e.target.closest('[data-cerrar-ventana]')) {
        cerrar();
      }
    });
    document.addEventListener('keydown', e => { if (e.key === 'Escape' && abierta) cerrar(); });
    // La página de adentro pide cerrar (Esc, "Cancelar" o un enlace de vuelta al panel): ver base_usuarios.html
    window.addEventListener('message', e => {
      if (e.origin === location.origin && e.source === marco.contentWindow && e.data === 'sinergi:cerrar-ventana') cerrar();
    });
  })();
</script>
